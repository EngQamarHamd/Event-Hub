<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ايفينت هاب - تفاصيل الفعالية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
  .event-page {
    background: radial-gradient(circle at top left, #001a33 0%, #000 100%);
  }

  .event-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 2.5rem;
  }
  @media (max-width: 992px) {
    .event-layout {
      grid-template-columns: 1fr;
    }
  }

  .event-card {
    background: rgba(0, 0, 40, 0.65);
    border: 1px solid rgba(0, 136, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.4s ease;
  }
  .event-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 25px rgba(0, 136, 255, 0.4);
  }

  .event-image img {
    max-height: 450px;
    object-fit: cover;
    filter: brightness(0.9);
  }
  .event-category-badge {
    background: linear-gradient(90deg, #007bff, #00bfff);
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    box-shadow: 0 0 15px rgba(0, 180, 255, 0.3);
  }

  .event-content h1 {
    letter-spacing: 1px;
    color: #eaf6ff;
  }
  .event-content p {
    font-size: 1rem;
  }

  .btn-gradient {
    background: linear-gradient(90deg, #005eff, #00b4ff);
    color: #fff;
    border: none;
    transition: all 0.4s ease;
  }
  .btn-gradient:hover {
    background: linear-gradient(90deg, #007bff, #00d4ff);
    box-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
    transform: translateY(-2px);
  }

  .event-sidebar {
    background: rgba(0, 0, 30, 0.7);
    border: 1px solid rgba(0, 100, 255, 0.2);
    padding: 1.5rem;
    border-radius: 1rem;
    box-shadow: 0 0 20px rgba(0, 120, 255, 0.15);
  }
  .related-events {
    display: grid;
    gap: 1.2rem;
  }

  .related-events .card {
    background: rgba(0, 0, 50, 0.6);
    border: 1px solid rgba(0, 140, 255, 0.2);
    transition: all 0.3s ease;
  }
  .related-events .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
  }

  .text-light-50 {
    color: rgba(255, 255, 255, 0.6);
  }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top py-3">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand fw-bold text-white fs-3 ms-auto" href="index.html">
      ايفينت هاب
    </a>

    <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
      aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-2"></i>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link text-white fw-semibold" href="index.html">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link text-white fw-semibold" href="events.html">الفعاليات</a></li>
        <li class="nav-item"><a class="nav-link text-white fw-semibold" href="about.html">من نحن</a></li>
        <li class="nav-item"><a class="nav-link text-white fw-semibold" href="contact.html">اتصل بنا</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container event-page py-5 mt-5">
  <div class="event-layout">
    
    <div class="event-main">
      <article class="event-card rounded-4 overflow-hidden shadow-lg border-0">
        <div class="event-image position-relative">
          <img id="event-img" class="img-fluid w-100" alt="صورة الفعالية">
          <span id="event-category" class="badge event-category-badge position-absolute top-0 start-0 m-3 px-3 py-2">التصنيف</span>
        </div>

        <div class="event-content p-4 p-md-5">
          <h1 id="event-title" class="fw-bold display-6 mb-3 text-light"></h1>

          <p class="text-light-50 mb-3">
            <i class="bi bi-calendar-event ms-2 text-info"></i>
            <span id="event-date"></span>
          </p>

          <div class="d-flex flex-wrap gap-3 my-4">
            <button class="btn btn-gradient rounded-pill px-4 py-2 fw-semibold shadow-sm">
              <i class="bi bi-calendar-plus ms-2"></i>إضافة إلى التقويم
            </button>
          </div>

          <section class="mb-5">
            <h2 class="h5 fw-semibold mb-3 text-info">الوصف التفصيلي</h2>
            <p id="event-description" class="text-light opacity-75 lh-lg"></p>
          </section>

          <section class="mb-4">
            <h3 class="h6 fw-semibold mb-3 text-info">المكان</h3>
            <p id="event-location" class="text-light opacity-75"></p>
          </section>
        </div>
      </article>
    </div>

    <aside class="event-sidebar">
      <h3 class="fw-semibold mb-4 text-light">فعاليات ذات صلة</h3>
      <div class="related-events" id="similar"></div>
    </aside>
  </div>
</main>

<footer class="bg-dark text-light pt-5 pb-3">
  <div class="container">
    <div class="row gy-4 text-center text-md-end align-items-start">
      
      <div class="col-md-4">
        <h5 class="fw-bold mb-3 text-uppercase">ايفينت هاب</h5>
        <p class="small text-secondary lh-lg">
          منصتك الأولى لإكتشاف فعاليات الجامعة الإفتراضية السورية.
        </p>
      </div>

      <div class="col-md-4">
        <h5 class="fw-bold mb-3 text-uppercase">اتصل بنا</h5>
        <ul class="list-unstyled small text-secondary mb-0">
          <li class="d-flex align-items-center justify-content-center justify-content-md-start gap-2">
            <i class="bi bi-envelope-fill text-primary"></i>
            <a href="mailto:EventHub@email.com" class="text-light text-decoration-none">
              EventHub@email.com
            </a>
          </li>
          <li class="mt-2 d-flex align-items-center justify-content-center justify-content-md-start gap-2" dir="ltr">
            <span class="text-light">+963 11111111</span>
            <i class="bi bi-telephone-fill text-primary"></i>
          </li>
        </ul>
      </div>

      <div class="col-md-4">
        <h5 class="fw-bold mb-3 text-uppercase">تابعنا</h5>
        <div class="d-flex justify-content-center justify-content-md-start gap-3 fs-4">
          <a href="#" class="text-light" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-light" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" class="text-light" aria-label="Twitter X"><i class="bi bi-twitter-x"></i></a>
          <a href="#" class="text-light" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
        </div>
      </div>

    </div>

    <hr class="my-4 border-secondary opacity-25">

    <div class="text-center small text-secondary">
      © 2026 ايفينت هاب — جميع الحقوق محفوظة
    </div>
  </div>
</footer>

<script>
 const allEvents = [
      {
        title: "المسابقة البرمجية العربية لعام 2023.",
        location: "جامعة دمشق",
        date: "20/9/2023",
        image: "assets/imgs/event-1.jpg",
        description: "مسابقة تهدف إلى تنمية مهارات البرمجة والتفكير المنطقي لدى المشاركين، وتعزيز روح الابتكار والمنافسة في المجال التقني.",
        category: "تقنية"
      },
      {
        title: "مسابقة المحتوى الرقمي العربي لعام 2019.",
        location: "دمشق – سوريا",
        date: "10/10/2019",
        image: "assets/imgs/event-2.jpg",
        description: "مسابقة تهدف إلى تشجيع إنتاج المحتوى الرقمي باللغة العربية ودعم الإبداع والابتكار في المجال الرقمي.",
        category: "ثقافية"
      },
      {
        title: "المسابقة البرمجية HIAST SVU CPC 2019.",
        location: "دمشق – سوريا",
        date: "25/10/2019",
        image: "assets/imgs/event-3.jpg",
        description: "مسابقة برمجية تهدف إلى تنمية مهارات حل المشكلات والتفكير المنطقي وتعزيز روح المنافسة بين الطلاب.",
        category: "تقنية"
      },
      {
        title: "إطلاق مسابقة SYROBTX 2026 للروبوتات.",
        location: "دمشق – سوريا",
        date: "2026",
        image: "assets/imgs/event-4.jpg",
        description: "مسابقة تهدف إلى تمكين الشباب من تعلم تقنيات برمجة الروبوتات وتنمية مهاراتهم في الابتكار والتصميم والعمل التقني.",
        category: "ثقافية"
      },
      {
        title: "المسابقة البرمجية العربية لعام 2024.",
        location: "دمشق – سوريا",
        date: "20/9/2024",
        image: "assets/imgs/event-5.jpg",
        description: "مسابقة تهدف إلى تطوير مهارات البرمجة وحل المشكلات وتعزيز الابتكار والتنافس بين المشاركين.",
        category: "تقنية"
      },
      {
        title: "المسابقة البرمجية للأطفال واليافعين لعام 2025.",
        location: "حمص – سوريا",
        date: "15/8/2025",
        image: "assets/imgs/event-6.jpg",
        description: "مسابقة تهدف إلى تنمية مهارات البرمجة والتفكير الإبداعي لدى الأطفال واليافعين وتشجيعهم على الابتكار.",
        category: "علمية"
      }
    ];

let currentEvent = JSON.parse(localStorage.getItem("selectedEvent")) || allEvents[0];

function renderEvent(event) {
  currentEvent = event;
  localStorage.setItem("selectedEvent", JSON.stringify(event));

  document.getElementById("event-img").src = event.image;
  document.getElementById("event-title").textContent = event.title;
  document.getElementById("event-date").textContent = event.date;
  document.getElementById("event-location").textContent = event.location;
  document.getElementById("event-description").textContent = event.description;
  document.getElementById("event-category").textContent = event.category;

  const similarContainer = document.getElementById("similar");
  similarContainer.innerHTML = "";
  const similarEvents = allEvents.filter(e => e.category === event.category && e.title !== event.title);

  if (similarEvents.length > 0) {
    similarEvents.forEach(sim => {
      const col = document.createElement("div");
      col.className = "col-12 similar-card";

      col.innerHTML = `
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
          <div class="position-relative">
            <img src="${sim.image}" class="card-img-top" alt="${sim.title}">
            <span class="position-absolute top-0 start-0 m-2 badge bg-primary">${sim.category}</span>
          </div>
          <div class="card-body d-flex flex-column">
            <h6 class="fw-bold mb-2 text-truncate">${sim.title}</h6>
            <p class="text-secondary small mb-3">${sim.location}</p>
            <a href="#" class="btn btn-outline-primary btn-sm rounded-pill mt-auto">التفاصيل</a>
          </div>
        </div>
      `;

      col.querySelector(".btn").addEventListener("click", (e) => {
        e.preventDefault();
        renderEvent(sim);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      similarContainer.appendChild(col);
    });
  } else {
    similarContainer.innerHTML = `<p class="text-muted">لا توجد فعاليات مشابهة.</p>`;
  }
}

renderEvent(currentEvent);
</script>

<script src="assets/JS/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
